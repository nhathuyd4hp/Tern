name: Build Installers
# Builds and releases only when a tag like v2.1.0 is pushed.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Tag matches the app version
        run: |
          version=$(node -p "require('./packages/electron/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version $version of packages/electron"
            exit 1
          fi

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps
        with:
          skip-build: 'true'

      - name: Lint
        run: npm run lint

      - name: Script API Check
        run: npm run generate:script-api --workspace=packages/js -- --check

  windows:
    name: Windows (nsis)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps
        with:
          shell: pwsh

      - name: Build web app
        shell: pwsh
        run: npm run build:web

      - name: Build installer
        shell: pwsh
        run: node scripts/build-electron.js

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: tern-windows
          path: packages/electron/out/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (AppImage, deb, rpm)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Install rpm tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build web app
        run: npm run build:web

      - name: Prepare the app
        run: node scripts/build-electron.js --prepare-only

      - name: Build AppImage, deb and rpm
        run: npm exec --workspace=packages/electron -- electron-builder --linux AppImage deb rpm --config electron-builder-config.js --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: tern-linux
          path: |
            packages/electron/out/*.AppImage
            packages/electron/out/*.deb
            packages/electron/out/*.rpm
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [lint, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: tern-*
          merge-multiple: true

      - name: Create the release
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Tern $GITHUB_REF_NAME" \
            --generate-notes
