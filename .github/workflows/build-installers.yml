name: Build Installers
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps
        with:
          skip-build: 'true'

      - name: Lint
        run: npm run lint

      - name: Script API Check
        run: npm run generate:script-api --workspace=packages/js -- --check

  windows:
    name: Windows (nsis)
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps
        with:
          shell: pwsh

      - name: Build web app
        shell: pwsh
        run: npm run build:web

      - name: Build installer
        shell: pwsh
        run: node scripts/build-electron.js

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: tern-windows
          path: packages/electron/out/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (AppImage, deb, rpm)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Install rpm tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build web app
        run: npm run build:web

      - name: Build AppImage
        run: node scripts/build-electron.js

      - name: Build deb
        run: npm run dist:deb --workspace=packages/electron -- --publish never

      - name: Build rpm
        run: npm run dist:rpm --workspace=packages/electron -- --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: tern-linux
          path: |
            packages/electron/out/*.AppImage
            packages/electron/out/*.deb
            packages/electron/out/*.rpm
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [windows, linux]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: tern-*
          merge-multiple: true

      - name: Replace the latest release
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Tern build ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7} on main."
