name: Build Installers
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps
        with:
          skip-build: 'true'

      # Warnings are allowed; any ESLint error fails the build and blocks the release.
      - name: Lint
        run: npm run lint

      - name: Script API Check
        run: npm run generate:script-api --workspace=packages/bruno-js -- --check

  windows:
    name: Windows (nsis)
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps
        with:
          shell: pwsh

      - name: Build web app
        shell: pwsh
        run: npm run build:web

      # build-electron.js logs errors instead of failing, so a missing installer is caught by the upload step.
      - name: Build installer
        shell: pwsh
        run: node scripts/build-electron.js

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: kevin-windows
          path: packages/bruno-electron/out/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (AppImage, deb, rpm)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Install rpm tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build web app
        run: npm run build:web

      # Prepares the web bundle and builds the AppImage; deb and rpm reuse that bundle.
      - name: Build AppImage
        run: node scripts/build-electron.js

      - name: Build deb
        run: npm run dist:deb --workspace=packages/bruno-electron

      - name: Build rpm
        run: npm run dist:rpm --workspace=packages/bruno-electron

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: kevin-linux
          path: |
            packages/bruno-electron/out/*.AppImage
            packages/bruno-electron/out/*.deb
            packages/bruno-electron/out/*.rpm
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS (dmg, unsigned)
    needs: lint
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      # No Apple certificate here: skip code signing so the build does not look for one.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Build web app
        run: npm run build:web

      - name: Prepare web bundle
        run: node scripts/build-electron.js --prepare-only

      - name: Build dmg (x64 and arm64)
        working-directory: packages/bruno-electron
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never --config electron-builder-config.js -c.mac.identity=null

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: kevin-macos
          path: packages/bruno-electron/out/*.dmg
          if-no-files-found: error
          retention-days: 14

  # Keeps a single rolling "latest" pre-release: the previous one (and its tag) is replaced on every build.
  release:
    name: Publish release
    needs: [windows, linux, macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: kevin-*
          merge-multiple: true

      - name: Replace the latest release
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Kevin build ${{ github.run_number }}" \
            --notes "Built from ${GITHUB_SHA::7} on main."
